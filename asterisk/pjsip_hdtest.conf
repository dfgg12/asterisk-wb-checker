; Example PJSIP endpoint snippets for codec-under-test forcing.
; Merge into pjsip.conf; adjust auth/aor to your setup.

; G.722 only - any transcode to narrowband kills the 6 kHz probe.
[hdtest-g722](!)
type = endpoint
allow = !all,g722
direct_media = no

; AMR-WB only - requires third-party codec_amr module
; (https://github.com/traud/asterisk-amr), AMR is not in core.
[hdtest-amrwb](!)
type = endpoint
allow = !all,amr-wb
direct_media = no

; Per-call codec override alternative (dialplan):
;   Set(PJSIP_MEDIA_OFFER(audio)=!all,g722)
;   Dial(PJSIP/${EXTEN}@testtrunk)
