; HD voice test context. Include from extensions.conf:
;   #include extensions_hdtest.conf
;
; Recordings land in /var/spool/asterisk/hdtest/ as 16 kHz WAV
; (.wav16 format) so the 6 kHz probe band is preserved.
; Create the dir: install -d -o asterisk /var/spool/asterisk/hdtest

[hd-test]
; Far end: answers and plays the dual-tone probe.
; Point remote test numbers / peer PBX at this.
exten => play,1,Answer()
 same => n,NoOp(HD-TEST play codec=${CHANNEL(audionativeformat)})
 same => n,Playback(hdtest)
 same => n,Hangup()

; Numeric alias for DID routing.
exten => 8000,1,Goto(play,1)

; Near end: records what actually arrived over the path under test.
; Used as the Originate target by wb-checker.
exten => record,1,Answer()
 same => n,NoOp(HD-TEST rec codec=${CHANNEL(audionativeformat)})
 same => n,Set(REC=/var/spool/asterisk/hdtest/hdtest-${EPOCH}-${UNIQUEID})
 same => n,Record(${REC}.wav16,0,8,k)
 same => n,Hangup()

exten => 8001,1,Goto(record,1)

; Loopback self-test: call this to verify tooling end-to-end
; without any trunk. Plays probe into MixMonitor recording.
exten => loopback,1,Answer()
 same => n,Set(REC=/var/spool/asterisk/hdtest/loop-${EPOCH}-${UNIQUEID})
 same => n,MixMonitor(${REC}.wav16)
 same => n,Playback(hdtest)
 same => n,StopMixMonitor()
 same => n,Hangup()
