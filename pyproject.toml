[project]
name = "wb-checker"
version = "0.1.0"
description = "HD voice (G.722 / AMR-WB) path tester for Asterisk PBX"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
wb-checker = "wb_checker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wb_checker"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "pylint>=3"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.pylint.format]
max-line-length = 79
